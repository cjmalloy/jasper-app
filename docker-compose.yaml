services:
  web:
    image: "ghcr.io/cjmalloy/jasper:${JASPER_SERVER_VERSION:-latest}"
    pull_policy: "${JASPER_SERVER_PULL:-missing}"
    restart: unless-stopped
    healthcheck:
      test: "curl -f http://localhost/management/health/readiness"
    networks:
      - data
      - backend
    environment:
      SERVER_PORT: 80
      SPRING_PROFILES_ACTIVE: "${JASPER_SERVER_PROFILES:-prod,jwt,storage}"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jasper
      SPRING_DATASOURCE_USERNAME: jasper
      SPRING_DATASOURCE_PASSWORD: "${JASPER_DATABASE_PASSWORD:-jasper}"
      JASPER_DEFAULT_ROLE: "${JASPER_SERVER_DEFAULT_ROLE:-ROLE_ANONYMOUS}"
      JASPER_ALLOW_USER_TAG_HEADER: true
      JASPER_OVERRIDE_SECURITY_MODE: "jwt"
      JASPER_OVERRIDE_SECURITY_CLIENT_ID: ""
      JASPER_OVERRIDE_SECURITY_BASE64_SECRET: "${JASPER_SERVER_KEY}"
      JASPER_OVERRIDE_SECURITY_VERIFIED_EMAIL_CLAIM: ""
      JASPER_OVERRIDE_SERVER_MAX_REPL_ENTITY_BATCH: 5000
      JASPER_OVERRIDE_SERVER_MAX_PUSH_ENTITY_BATCH: 100000
      JASPER_OVERRIDE_SERVER_MAX_PULL_ENTITY_BATCH: 100000
      JASPER_HEAP: "${JASPER_SERVER_HEAP:-1g}"
    volumes:
      - "${JASPER_STORAGE_DIR:-/var/lib/jasper}:/var/lib/jasper"
    depends_on:
      - db
  db:
    image: "postgres:${JASPER_DATABASE_VERSION:-18}"
    pull_policy: "${JASPER_DATABASE_PULL:-missing}"
    restart: unless-stopped
    networks:
      - data
    environment:
      POSTGRES_USER: jasper
      POSTGRES_PASSWORD: "${JASPER_DATABASE_PASSWORD:-jasper}"
      POSTGRES_DB: jasper
    volumes:
      - "${JASPER_DATA_DIR:?Must Set Data Dir}:/var/lib/postgresql"
  client:
    image: "ghcr.io/cjmalloy/jasper-ui:${JASPER_CLIENT_VERSION:-latest}"
    pull_policy: "${JASPER_CLIENT_PULL:-missing}"
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${JASPER_CLIENT_PORT:-8082}:80"
    environment:
      JASPER_API_PROXY: "http://web:80"
      JASPER_TITLE: "${JASPER_CLIENT_TITLE}"
      JASPER_LOCALE: "${JASPER_LOCALE}"
      JASPER_VERSION: "${JASPER_CLIENT_VERSION:-latest}"
      JASPER_PREFETCH: "${JASPER_PREFETCH:-true}"
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    depends_on:
      - web
  ssh:
    image: "ghcr.io/cjmalloy/jasper-ssh:${JASPER_SSH_VERSION:-latest}"
    pull_policy: "${JASPER_SSH_PULL:-missing}"
    restart: unless-stopped
    healthcheck:
      test: "/healthcheck.sh"
      retries: 1
    networks:
      - backend
      - edge
    ports:
      - "127.0.0.1:${JASPER_SSH_PORT:-8022}:22"
    environment:
      UPSTREAM: "http://web:80"
    volumes:
      - "${JASPER_STORAGE_DIR:-/var/lib/jasper}/default/config:/config"
      - "${JASPER_STORAGE_DIR:-/var/lib/jasper}/default/secrets:/secrets"
    depends_on:
      - web
  cf:
    profiles:
      - cf
    image: cloudflare/cloudflared
    pull_policy: always
    restart: unless-stopped
    networks:
      - edge
    command: tunnel run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TOKEN}"
    depends_on:
      - proxy
  proxy:
    profiles:
      - cf
    image: "ghcr.io/cjmalloy/jasper-ui:${JASPER_CLIENT_VERSION:-latest}"
    pull_policy: "${JASPER_CLIENT_PULL:-missing}"
    restart: unless-stopped
    networks:
      - backend
      - edge
    environment:
      JASPER_API_PROXY: "http://web:80"
      JASPER_TITLE: "${JASPER_CLIENT_TITLE}"
      JASPER_LOCALE: "${JASPER_LOCALE}"
      JASPER_VERSION: "${JASPER_CLIENT_VERSION:-latest}"
      JASPER_PREFETCH: "${JASPER_PREFETCH:-true}"
    depends_on:
      - web
  ngrok:
    profiles:
      - ngrok
    image: ngrok/ngrok
    pull_policy: always
    restart: unless-stopped
    networks:
      - edge
    command: "tcp ssh:22 --url=tcp://${NGROK_URL}"
    environment:
      NGROK_AUTHTOKEN: "${NGROK_TOKEN}"
    depends_on:
      - ssh
networks:
  # Only the server can reach the database, and the database can't reach anything else
  data:
    internal: true
  # Containers that talk to the server. Not internal so the server can fetch, replicate and run scripts.
  backend:
  # Tunnels. They can only reach the anonymous proxy and SSH, never the server directly.
  edge:
