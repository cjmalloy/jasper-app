name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Create Draft Release
        id: create_release
        run: |
          gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes "Release binaries for version ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: create-draft
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v') 
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Windows Build Dependencies (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Build Electron App
        run: |
          npm ci
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run ci -- --mac
          else
            npm run ci -- --linux --win
          fi

      - name: Upload Binary to Existing Draft
        run: |
          shopt -s extglob
          gh release upload "${{ github.ref_name }}" release/*.@(dmg|AppImage|exe) --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
