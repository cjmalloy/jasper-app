name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Create Draft Release
        id: create_release
        run: |
          gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes "Release binaries for version ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: create-draft
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Build Electron App
        shell: bash
        run: |
          npm ci --include=optional
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run ci -- --mac
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            npm run ci -- --linux
          else
            npm run ci -- --win --x64
          fi

      - name: Upload Binary to Existing Draft
        shell: bash
        run: |
          shopt -s extglob
          gh release upload "${{ github.ref_name }}" release/*.@(dmg|AppImage|exe|zip|yml|blockmap) --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
