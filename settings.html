<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jasper Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    hr {
      border: none;
      border-top: 1px dotted black;
    }
    .label-column {
      display: grid;
      grid-gap: 8px;
      grid-template-columns: min-content auto;
    }
    label, button, .cb span {
      white-space: nowrap;
    }
    input[type="checkbox"] {
      width: 15px;
      height: 15px;
    }
    .form-array {
      display: flex;
    }
    .form-array *:not(:first-child) {
      margin-left: 3px;
    }
    .form-array > input {
      flex: 1;
    }
    .form-array > input + select {
      margin-left: -3px !important;
    }
    .au > label {
      vertical-align: top;
      font-size: 18px;
    }
    .loading {
      display: none;
      pointer-events: none;
      opacity: 0;
      position: relative;
      top: -25px;
      text-align: center;
      font-size: 40px;
      height: 21.5px;
      min-width: 116px;
      overflow: visible;
      animation: fadein 2s ease-in-out 1s;
      animation-iteration-count: infinite;
    }
    .form-array .loading {
      min-width: 60px;
    }
    .form-array .update {
      min-width: 60px;
    }
    select.version {
      width: 20px;
      text-indent: -9999px;
    }
    @keyframes fadein {
      from {
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #242424;
        color: #c9c9c9;
        color-scheme: dark;
      }
      hr {
        border-top: 1px dotted lightgrey;
      }
    }
  </style>
  <script>
    const fields = [
      'locale',
      'appVersion',
      'serverVersion',
      'serverProfiles',
      'serverDefaultRole',
      'serverRam',
      'storageDir',
      'clientVersion',
      'clientTitle',
      'clientPort',
      'sshVersion',
      'sshPort',
      'cfToken',
      'ngrokUrl',
      'ngrokToken',
      'databaseVersion',
      'dataDir',
    ];
    const profiles = [
      'prod',
      'debug',
      'scripts',
      'proxy',
      'file-cache',
      'recycler',
      'preload',
      'archive',
    ];
    const flags = [
      'autoUpdate',
      'pullClient',
      'pullServer',
      'pullDatabase',
      'pullSsh',
      'showLogsOnStart',
    ];

    const el = id => document.getElementById(id);

    window.electronAPI.handleSettings((event, settings) => {
      const activeProfiles = (settings.serverProfiles ?? '').replace(/\s+/g, '').split(',');
      if (settings.serverProfiles) {
        for (const p of profiles) {
          const cb = el(`serverProfiles_${p}`);
          if (cb) cb.checked = activeProfiles.includes(p);
        }
      }
      const archiveSaved = activeProfiles.includes('archive');
      el('serverProfiles_archive').disabled = archiveSaved;
      el('serverProfiles_archive-lock').style.display = archiveSaved ? '' : 'none';
      for (const f of fields) {
        el(f).value = settings[f] ?? '';
      }
      for (const f of flags) {
        el(f).checked = settings[f] ?? false;
      }
    });

    window.electronAPI.notifyFinished((event, command) => {
      finished(command);
    });

    // Newest first, with less specific tags before more specific ones (v1.4, v1.4.1, v1.4.0, v1.3, ...)
    function compareVersions(a, b) {
      const pa = a.replace(/^v/, '').split('.');
      const pb = b.replace(/^v/, '').split('.');
      for (let i = 0; i < Math.min(pa.length, pb.length); i++) {
        if (pa[i] !== pb[i]) return pb[i].localeCompare(pa[i], undefined, { numeric: true });
      }
      return pa.length - pb.length;
    }

    window.electronAPI.updateImageTags((event, imageTags) => {
      for (const [key, value] of Object.entries(imageTags)) {
        if (!value || !value.length) continue;
        const select = el(key);
        value.sort(compareVersions);
        select.replaceChildren(new Option('latest'), ...value.map(tag => new Option(tag)));
        select.value = el(`${key}Version`).value;
      }
    });

    function save() {
      const settings = {};
      for (const f of fields) {
        settings[f] = el(f).value;
      }
      for (const f of flags) {
        settings[f] = el(f).checked;
      }
      window.electronAPI.saveSettings(settings);
      window.close();
    }

    function updateVersion(f) {
      const value = el(f).value;
      window.electronAPI.updateVersion(f, value);
      el(`${f}-button`).style.display = 'none';
      el(`${f}-loading`).style.display = 'block';
    }

    function patch(f) {
      window.electronAPI.patchSettings({name: f, value: el(f).checked});
    }

    function openDir(dir) {
      window.electronAPI.openDir(dir);
    }

    function sendCommand(id, ...args) {
      window.electronAPI.command(id, args);
      el(`${id}-button`).style.display = 'none';
      el(`${id}-loading`).style.display = 'block';
    }

    function finished(id) {
      el(`${id}-button`).style.display = 'block';
      el(`${id}-loading`).style.display = 'none';
    }

    function toggleArchive() {
      const archive = el('serverProfiles_archive');
      if (archive.checked && !confirm(
        'Enabling the Archive profile turns the database into an append-only log.\n\n' +
        'Once enabled and saved it cannot be disabled.\n\n' +
        'Are you sure you want to enable it?')) {
        archive.checked = false;
      }
      updateProfiles();
    }

    function updateProfiles() {
      const activeProfiles = ['prod', 'storage', 'jwt'];
      for (const p of profiles) {
        if (el(`serverProfiles_${p}`)?.checked) activeProfiles.push(p)
      }
      el('serverProfiles').value = activeProfiles.join(',');
    }
    window.onload = () => {
      window.electronAPI.fetchSettings();
      for (const input of document.querySelectorAll('input')) {
        input.addEventListener('focus', () => input.style.zIndex = 1);
        input.addEventListener('blur', () => input.style.zIndex = '');
      }
    };
  </script>
</head>
<body>
<h1>Jasper Application Settings</h1>
<div class="label-column">

  <label for="locale">Language</label>
  <div class="form-array">
    <select id="locale">
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <label for="appVersion">App Version</label>
  <div class="form-array">
    <input id="appVersion" type="text" disabled>
    <div title="Check for updates on startup" class="au"><label for="autoUpdate">🔄</label><input id="autoUpdate" type="checkbox" onchange="patch('autoUpdate')"></div>
  </div>

  <label for="serverVersion">Server Version</label>
  <div class="form-array">
    <input id="serverVersion" type="text">
    <select id="server" class="version" onchange="el('serverVersion').value = el('server').value">
      <option>latest</option>
      <option>v1</option>
      <option>v1.4</option>
      <option>v1.3</option>
    </select>
    <button id="serverVersion-button" class="update" type="button" title="Restart this service with the new version" onclick="updateVersion('serverVersion')">Update</button>
    <span id="serverVersion-loading" class="loading">...</span>
    <div title="Check for updates on startup" class="au"><label for="pullServer">🔄</label><input id="pullServer" type="checkbox"></div>
  </div>

  <label for="serverProfiles">Server Profiles</label>
  <div class="cb">
    <span><input type="checkbox" id="serverProfiles_scripts" onclick="updateProfiles()"><label for="serverProfiles_scripts">Server Scripts</label></span>
    <span><input type="checkbox" id="serverProfiles_proxy" onclick="updateProfiles()"><label for="serverProfiles_proxy">Proxy</label></span>
    <span><input type="checkbox" id="serverProfiles_file-cache" onclick="updateProfiles()"><label for="serverProfiles_file-cache">File Cache</label></span>
    <span><input type="checkbox" id="serverProfiles_recycler" onclick="updateProfiles()"><label for="serverProfiles_recycler">Recycler</label></span>
    <span><input type="checkbox" id="serverProfiles_preload" onclick="updateProfiles()"><label for="serverProfiles_preload">Preload</label></span>
    <span><input type="checkbox" id="serverProfiles_debug" onclick="updateProfiles()"><label for="serverProfiles_debug">Debug</label></span>
    <span title="Database is an append-only log. Cannot be disabled once enabled."><input type="checkbox" id="serverProfiles_archive" onclick="toggleArchive()"><label for="serverProfiles_archive">Archive</label><span id="serverProfiles_archive-lock" style="display: none">🔒</span></span>
  </div>

  <span></span>
  <input id="serverProfiles" type="text">

  <label for="serverDefaultRole">Default Role</label>
  <div class="form-array">
    <select id="serverDefaultRole">
      <option value="ROLE_ADMIN">admin</option>
      <option value="ROLE_MOD">mod</option>
      <option value="ROLE_EDITOR">editor</option>
      <option value="ROLE_USER">user</option>
      <option value="ROLE_VIEWER">viewer</option>
      <option value="ROLE_ANONYMOUS">anon</option>
    </select>
  </div>

  <label for="serverRam">Server RAM</label>
  <input id="serverRam" type="text">

  <label for="storageDir">Server Storage</label>
  <div class="form-array">
    <input id="storageDir" type="text">
    <button type="button" onclick="openDir(el('storageDir').value)">📂️</button>
  </div>

  <label for="clientVersion">UI Version</label>
  <div class="form-array">
    <input id="clientVersion" type="text">
    <select id="client" class="version" onchange="el('clientVersion').value = el('client').value">
      <option>latest</option>
      <option>v1</option>
      <option>v1.4</option>
      <option>v1.3</option>
    </select>
    <button id="clientVersion-button" class="update" type="button" title="Restart this service with the new version" onclick="updateVersion('clientVersion')">Update</button>
    <span id="clientVersion-loading" class="loading">...</span>
    <div title="Check for updates on startup" class="au"><label for="pullClient">🔄</label><input id="pullClient" type="checkbox"></div>
  </div>

  <label for="clientTitle">UI Title</label>
  <input id="clientTitle" type="text">

  <label for="clientPort">UI Port</label>
  <input id="clientPort" type="text">

  <label for="databaseVersion">Postgres Version</label>
  <div class="form-array">
    <input id="databaseVersion" type="text">
    <select id="database" class="version" onchange="el('databaseVersion').value = el('database').value">
      <option>latest</option>
      <option>18</option>
    </select>
    <button id="databaseVersion-button" class="update" type="button" title="Restart this service with the new version" onclick="updateVersion('databaseVersion')">Update</button>
    <span id="databaseVersion-loading" class="loading">...</span>
    <div title="Check for updates on startup" class="au"><label for="pullDatabase">🔄</label><input id="pullDatabase" type="checkbox"></div>
  </div>

  <label for="dataDir">Postgres Directory</label>
  <div class="form-array">
    <input id="dataDir" type="text">
    <button type="button" onclick="openDir(el('dataDir').value)">📂️</button>
  </div>

  <label for="sshVersion">SSH Version</label>
  <div class="form-array">
    <input id="sshVersion" type="text">
    <select id="ssh" class="version" onchange="el('sshVersion').value = el('ssh').value">
      <option>latest</option>
      <option>v1</option>
      <option>v1.3</option>
      <option>v1.2</option>
      <option>v1.1</option>
    </select>
    <button id="sshVersion-button" class="update" type="button" title="Restart this service with the new version" onclick="updateVersion('sshVersion')">Update</button>
    <span id="sshVersion-loading" class="loading">...</span>
    <div title="Check for updates on startup" class="au"><label for="pullSsh">🔄</label><input id="pullSsh" type="checkbox"></div>
  </div>

  <label for="sshPort">SSH Port</label>
  <input id="sshPort" type="text">

  <label for="cfToken">Cloudflare Token</label>
  <input id="cfToken" type="text">

  <label for="ngrokUrl">Ngrok URL</label>
  <input id="ngrokUrl" type="text">

  <label for="ngrokToken">Ngrok Token</label>
  <input id="ngrokToken" type="text">

  <label for="showLogsOnStart">Show Logs on Startup</label>
  <div><input id="showLogsOnStart" type="checkbox" onchange="patch('showLogsOnStart')"></div>

  <span><!-- Buttons --></span>
  <div>
    <button type="button" onclick="save()">Save & Hard Reload</button>
  </div>
</div>
<br>
<hr>
<h2>Troubleshooting</h2>
<div class="label-column">

  <button id="restart-button" type="button" onclick="sendCommand('restart')">Restart</button>
  <span id="restart-loading" class="loading">...</span>
  <label>Restart the servers and database</label>

  <button id="pull-button" type="button" onclick="sendCommand('pull')">Pull New Images</button>
  <span id="pull-loading" class="loading">...</span>
  <label>Check for updates and download them if available</label>

  <button id="down-button" type="button" onclick="sendCommand('down')">Stop</button>
  <span id="down-loading" class="loading">...</span>
  <label>Stop all servers and database</label>

  <button id="up-button" type="button" onclick="sendCommand('up')">Start</button>
  <span id="up-loading" class="loading">...</span>
  <label>Start all servers and database if not already started</label>

  <button id="pause-button" type="button" onclick="sendCommand('pause')">Pause</button>
  <span id="pause-loading" class="loading">...</span>
  <label>Pause all servers and database</label>

  <button id="unpause-button" type="button" onclick="sendCommand('unpause')">Unpause</button>
  <span id="unpause-loading" class="loading">...</span>
  <label>Unpause all servers and database</label>
</div>
</body>
</html>
