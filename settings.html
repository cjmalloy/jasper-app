<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n>Jasper Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="node_modules/jquery/dist/jquery.min.js"></script>
  <script src="i18n.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    hr {
      border: none;
      border-top: 1px dotted black;
    }
    .label-column {
      display: grid;
      grid-gap: 8px;
      grid-template-columns: min-content auto;
    }
    label, button, .cb span {
      white-space: nowrap;
    }
    input[type="checkbox"] {
      width: 15px;
      height: 15px;
    }
    .form-array {
      display: flex;
    }
    .form-array *:not(:first-child) {
      margin-left: 3px;
    }
    .form-array > input {
      flex: 1;
    }
    .form-array > input + select {
      margin-left: -3px !important;
    }
    .au {
      display: flex;
      align-items: center;
    }
    .au > label {
      font-size: 18px;
    }
    .loading {
      display: none;
      pointer-events: none;
      opacity: 0;
      position: relative;
      top: -25px;
      text-align: center;
      font-size: 40px;
      height: 21.5px;
      min-width: 116px;
      overflow: visible;
      animation: fadein 2s ease-in-out 1s;
      animation-iteration-count: infinite;
    }
    .form-array .loading {
      min-width: 60px;
    }
    .form-array .update {
      min-width: 60px;
    }
    select.version {
      width: 20px;
      text-indent: -9999px;
    }
    @keyframes fadein {
      from {
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #242424;
        color: #c9c9c9;
        color-scheme: dark;
      }
      hr {
        border-top: 1px dotted lightgrey;
      }
    }
  </style>
  <script>
    const fields = [
      'locale',
      'appVersion',
      'serverVersion',
      'serverProfiles',
      'serverDefaultRole',
      'serverRam',
      'storageDir',
      'clientVersion',
      'clientTitle',
      'clientPort',
      'sshVersion',
      'sshPort',
      'cfToken',
      'ngrokUrl',
      'ngrokToken',
      'databaseVersion',
      'dataDir',
    ];
    const profiles = [
      'prod',
      'debug',
      'scripts',
      'proxy',
      'file-cache',
      'recycler',
      'preload',
      'archive',
    ];
    const flags = [
      'autoUpdate',
      'pullClient',
      'pullServer',
      'pullDatabase',
      'pullSsh',
      'showLogsOnStart',
    ];

    window.electronAPI.handleSettings((event, settings) => {
      applyLocale(settings.locale);
      const activeProfiles = (settings.serverProfiles ?? '').replace(/\s+/g, '').split(',');
      if (settings.serverProfiles) {
        for (const p of profiles) {
          $(`#serverProfiles_${p}`).prop('checked', activeProfiles.includes(p));
        }
      }
      const archiveSaved = activeProfiles.includes('archive');
      $('#serverProfiles_archive').prop('disabled', archiveSaved);
      $('#serverProfiles_archive-lock').css('display', archiveSaved ? '' : 'none');
      for (const f of fields) {
        $('#' + f).val(settings[f] ?? '');
      }
      for (const f of flags) {
        $('#' + f).prop('checked', settings[f] ?? false);
      }
      $('select.version').each((i, el) => $(el).val($(`#${el.id}Version`).val()));
    });

    window.electronAPI.notifyFinished((event, command) => {
      finished(command);
    });

    // Newest first, with less specific tags before more specific ones (v1.4, v1.4.1, v1.4.0, v1.3, ...)
    function compareVersions(a, b) {
      const pa = a.replace(/^v/, '').split('.');
      const pb = b.replace(/^v/, '').split('.');
      for (let i = 0; i < Math.min(pa.length, pb.length); i++) {
        if (pa[i] !== pb[i]) return pb[i].localeCompare(pa[i], undefined, { numeric: true });
      }
      return pa.length - pb.length;
    }

    window.electronAPI.updateImageTags((event, imageTags) => {
      for (const [key, value] of Object.entries(imageTags)) {
        if (!value || !value.length) continue;
        const $select = $(`#${key}`);
        $select.html('');
        value.sort(compareVersions);
        $select.append($('<option>').text('latest'));
        for (const tag of value) {
          $select.append($('<option>').text(tag));
        }
        $select.val($(`#${key}Version`).val());
      }
    });

    function save() {
      const settings = {};
      for (const f of fields) {
        settings[f] = $('#' + f).val();
      }
      for (const f of flags) {
        settings[f] = $('#' + f).prop('checked');
      }
      window.electronAPI.saveSettings(settings);
      window.close();
    }

    function updateVersion(f) {
      const value = $('#' + f).val();
      window.electronAPI.updateVersion(f, value);
      $(`#${f}-button`).css('display', 'none');
      $(`#${f}-loading`).css('display', 'block');
    }

    function patch(f) {
      window.electronAPI.patchSettings({name: f, value: $('#' + f).prop('checked')});
    }

    function openDir(dir) {
      window.electronAPI.openDir(dir);
    }

    function sendCommand(id, ...args) {
      window.electronAPI.command(id, args);
      $(`#${id}-button`).css('display', 'none');
      $(`#${id}-loading`).css('display', 'block');
    }

    function finished(id) {
      $(`#${id}-button`).css('display', 'block');
      $(`#${id}-loading`).css('display', 'none');
    }

    function toggleArchive() {
      const $archive = $('#serverProfiles_archive');
      if ($archive.prop('checked') && !confirm(t(
        'Enabling the Archive profile turns the database into an append-only log.\n\n' +
        'Once enabled and saved it cannot be disabled.\n\n' +
        'Are you sure you want to enable it?'))) {
        $archive.prop('checked', false);
      }
      updateProfiles();
    }

    function updateProfiles() {
      const activeProfiles = ['prod', 'storage', 'jwt'];
      for (const p of profiles) {
        if ($(`#serverProfiles_${p}`).prop('checked')) activeProfiles.push(p)
      }
      $('#serverProfiles').val(activeProfiles.join(','));
    }
    window.onload = () => {
      applyLocale($('#locale').val());
      // Preview the selected language; it is saved with the other settings
      $('#locale').on('change', e => applyLocale(e.currentTarget.value));
      window.electronAPI.fetchSettings();
      $('select.version').each((i, el) => {
        $(`#${el.id}Version`).on('input', e => $(el).val(e.currentTarget.value));
      });
      $('input')
        .focus(e => $(e.currentTarget).css('z-index', 1))
        .blur(e => $(e.currentTarget).css('z-index', ''));
    };
  </script>
</head>
<body>
<h1 data-i18n>Jasper Application Settings</h1>
<div class="label-column">

  <label for="locale" data-i18n>Language</label>
  <div class="form-array">
    <select id="locale">
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <label for="appVersion" data-i18n>App Version</label>
  <div class="form-array">
    <input id="appVersion" type="text" disabled>
    <div data-i18n-title title="Check for updates on startup" class="au"><label for="autoUpdate">🔄</label><input id="autoUpdate" type="checkbox" onchange="patch('autoUpdate')"></div>
  </div>

  <label for="serverVersion" data-i18n>Server Version</label>
  <div class="form-array">
    <input id="serverVersion" type="text">
    <select id="server" class="version" onchange="$('#serverVersion').val($('#server').val())">
      <option>latest</option>
      <option>v1</option>
      <option>v1.5</option>
      <option>v1.4</option>
      <option>v1.3</option>
    </select>
    <button id="serverVersion-button" class="update" type="button" data-i18n-title title="Restart this service with the new version" onclick="updateVersion('serverVersion')" data-i18n>Update</button>
    <span id="serverVersion-loading" class="loading">...</span>
    <div data-i18n-title title="Check for updates on startup" class="au"><label for="pullServer">🔄</label><input id="pullServer" type="checkbox"></div>
  </div>

  <label for="serverProfiles" data-i18n>Server Profiles</label>
  <div class="cb">
    <span><input type="checkbox" id="serverProfiles_scripts" onclick="updateProfiles()"><label for="serverProfiles_scripts" data-i18n>Server Scripts</label></span>
    <span><input type="checkbox" id="serverProfiles_proxy" onclick="updateProfiles()"><label for="serverProfiles_proxy" data-i18n>Proxy</label></span>
    <span><input type="checkbox" id="serverProfiles_file-cache" onclick="updateProfiles()"><label for="serverProfiles_file-cache" data-i18n>File Cache</label></span>
    <span><input type="checkbox" id="serverProfiles_recycler" onclick="updateProfiles()"><label for="serverProfiles_recycler" data-i18n>Recycler</label></span>
    <span><input type="checkbox" id="serverProfiles_preload" onclick="updateProfiles()"><label for="serverProfiles_preload" data-i18n>Preload</label></span>
    <span><input type="checkbox" id="serverProfiles_debug" onclick="updateProfiles()"><label for="serverProfiles_debug" data-i18n>Debug</label></span>
    <span data-i18n-title title="Database is an append-only log. Cannot be disabled once enabled."><input type="checkbox" id="serverProfiles_archive" onclick="toggleArchive()"><label for="serverProfiles_archive" data-i18n>Archive</label><span id="serverProfiles_archive-lock" style="display: none">🔒</span></span>
  </div>

  <span></span>
  <input id="serverProfiles" type="text">

  <label for="serverDefaultRole" data-i18n>Default Role</label>
  <div class="form-array">
    <select id="serverDefaultRole">
      <option value="ROLE_ADMIN" data-i18n>admin</option>
      <option value="ROLE_MOD" data-i18n>mod</option>
      <option value="ROLE_EDITOR" data-i18n>editor</option>
      <option value="ROLE_USER" data-i18n>user</option>
      <option value="ROLE_VIEWER" data-i18n>viewer</option>
      <option value="ROLE_ANONYMOUS" data-i18n>anon</option>
    </select>
  </div>

  <label for="serverRam" data-i18n>Server RAM</label>
  <input id="serverRam" type="text">

  <label for="storageDir" data-i18n>Server Storage</label>
  <div class="form-array">
    <input id="storageDir" type="text">
    <button type="button" data-i18n-title title="Open folder" onclick="openDir($('#storageDir').val())">📂️</button>
  </div>

  <label for="clientVersion" data-i18n>UI Version</label>
  <div class="form-array">
    <input id="clientVersion" type="text">
    <select id="client" class="version" onchange="$('#clientVersion').val($('#client').val())">
      <option>latest</option>
      <option>v1</option>
      <option>v1.5</option>
      <option>v1.4</option>
      <option>v1.3</option>
    </select>
    <button id="clientVersion-button" class="update" type="button" data-i18n-title title="Restart this service with the new version" onclick="updateVersion('clientVersion')" data-i18n>Update</button>
    <span id="clientVersion-loading" class="loading">...</span>
    <div data-i18n-title title="Check for updates on startup" class="au"><label for="pullClient">🔄</label><input id="pullClient" type="checkbox"></div>
  </div>

  <label for="clientTitle" data-i18n>UI Title</label>
  <input id="clientTitle" type="text">

  <label for="clientPort" data-i18n>UI Port</label>
  <input id="clientPort" type="text">

  <label for="databaseVersion" data-i18n>Postgres Version</label>
  <div class="form-array">
    <input id="databaseVersion" type="text">
    <select id="database" class="version" onchange="$('#databaseVersion').val($('#database').val())">
      <option>latest</option>
      <option>18</option>
    </select>
    <button id="databaseVersion-button" class="update" type="button" data-i18n-title title="Restart this service with the new version" onclick="updateVersion('databaseVersion')" data-i18n>Update</button>
    <span id="databaseVersion-loading" class="loading">...</span>
    <div data-i18n-title title="Check for updates on startup" class="au"><label for="pullDatabase">🔄</label><input id="pullDatabase" type="checkbox"></div>
  </div>

  <label for="dataDir" data-i18n>Postgres Directory</label>
  <div class="form-array">
    <input id="dataDir" type="text">
    <button type="button" data-i18n-title title="Open folder" onclick="openDir($('#dataDir').val())">📂️</button>
  </div>

  <label for="sshVersion" data-i18n>SSH Version</label>
  <div class="form-array">
    <input id="sshVersion" type="text">
    <select id="ssh" class="version" onchange="$('#sshVersion').val($('#ssh').val())">
      <option>latest</option>
      <option>v1</option>
      <option>v1.3</option>
      <option>v1.2</option>
      <option>v1.1</option>
    </select>
    <button id="sshVersion-button" class="update" type="button" data-i18n-title title="Restart this service with the new version" onclick="updateVersion('sshVersion')" data-i18n>Update</button>
    <span id="sshVersion-loading" class="loading">...</span>
    <div data-i18n-title title="Check for updates on startup" class="au"><label for="pullSsh">🔄</label><input id="pullSsh" type="checkbox"></div>
  </div>

  <label for="sshPort" data-i18n>SSH Port</label>
  <input id="sshPort" type="text">

  <label for="cfToken" data-i18n>Cloudflare Token</label>
  <input id="cfToken" type="text">

  <label for="ngrokUrl" data-i18n>Ngrok URL</label>
  <input id="ngrokUrl" type="text">

  <label for="ngrokToken" data-i18n>Ngrok Token</label>
  <input id="ngrokToken" type="text">

  <label for="showLogsOnStart" data-i18n>Show Logs on Startup</label>
  <div><input id="showLogsOnStart" type="checkbox" onchange="patch('showLogsOnStart')"></div>

  <span><!-- Buttons --></span>
  <div>
    <button type="button" onclick="save()" data-i18n>Save & Hard Reload</button>
  </div>
</div>
<br>
<hr>
<h2 data-i18n>Troubleshooting</h2>
<div class="label-column">

  <button id="restart-button" type="button" onclick="sendCommand('restart')" data-i18n>Restart</button>
  <span id="restart-loading" class="loading">...</span>
  <label data-i18n>Restart the servers and database</label>

  <button id="pull-button" type="button" onclick="sendCommand('pull')" data-i18n>Pull New Images</button>
  <span id="pull-loading" class="loading">...</span>
  <label data-i18n>Check for updates and download them if available</label>

  <button id="down-button" type="button" onclick="sendCommand('down')" data-i18n>Stop</button>
  <span id="down-loading" class="loading">...</span>
  <label data-i18n>Stop all servers and database</label>

  <button id="up-button" type="button" onclick="sendCommand('up')" data-i18n>Start</button>
  <span id="up-loading" class="loading">...</span>
  <label data-i18n>Start all servers and database if not already started</label>

  <button id="pause-button" type="button" onclick="sendCommand('pause')" data-i18n>Pause</button>
  <span id="pause-loading" class="loading">...</span>
  <label data-i18n>Pause all servers and database</label>

  <button id="unpause-button" type="button" onclick="sendCommand('unpause')" data-i18n>Unpause</button>
  <span id="unpause-loading" class="loading">...</span>
  <label data-i18n>Unpause all servers and database</label>
</div>
</body>
</html>
