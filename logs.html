<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Jasper Logs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: white;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #242424;
        color-scheme: dark;
      }
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: sans-serif;
      font-size: 13px;
    }
    #services {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      padding: 4px 8px;
    }
    #services label {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    #terminal {
      flex: 1;
      min-height: 0;
    }
  </style>
  <script>
    // Hide lines prefixed by "<service>-N | " for services that are not checked.
    // Lines without a service prefix (compose status, pull progress) are always shown.
    const maxRaw = 512 * 1024;
    const ansi = /\x1b\[[0-9;?]*[a-zA-Z]|\x1b\][^\x07]*\x07|\x1b(\[[0-9;?]*)?$/g;
    let services = [];
    let enabled = new Set(['web']);
    let raw = '';
    let line = '';
    let lineState = null;
    function lineVisible(text, complete) {
      const plain = text.replace(ansi, '').replace(/^\r+/, '');
      const m = plain.match(/^([A-Za-z0-9][\w.-]*?)[-_]\d+\s*\|/);
      if (m) {
        const service = services.find(s => m[1] === s || m[1].endsWith('-' + s) || m[1].endsWith('_' + s));
        return !service || enabled.has(service);
      }
      if (!complete && plain.length < 100 && /^[\w.-]*\s*$/.test(plain)) return null;
      return true;
    }
    function filter(data) {
      let out = '';
      for (const part of data.split(/(\n)/)) {
        if (part === '\n') {
          if (lineState === null) lineState = lineVisible(line, true);
          if (lineState) out += line + '\n';
          line = '';
          lineState = null;
        } else if (part) {
          if (lineState === null) {
            line += part;
            lineState = lineVisible(line, false);
            if (lineState) {
              out += line;
              line = '';
            }
          } else if (lineState) {
            out += part;
          }
        }
      }
      return out;
    }
    // Buffer logs until the terminal is ready so none are dropped
    let term = null;
    const pending = [];
    window.electronAPI.streamLogs((event, data) => {
      raw += data;
      if (raw.length > maxRaw) {
        raw = raw.slice(-maxRaw);
        raw = raw.slice(raw.indexOf('\n') + 1);
      }
      if (term) {
        term.write(filter(data));
      } else {
        pending.push(data);
      }
    });
    function refilter() {
      if (!term) return;
      line = '';
      lineState = null;
      term.reset();
      term.write(filter(raw));
    }
    function renderServices() {
      const el = document.getElementById('services');
      el.replaceChildren(...services.map(s => {
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = enabled.has(s);
        input.addEventListener('change', () => {
          if (input.checked) {
            enabled.add(s);
          } else {
            enabled.delete(s);
          }
          window.electronAPI.setLogServices([...enabled]);
          refilter();
        });
        label.append(input, s);
        return label;
      }));
    }
    window.electronAPI.handleLogServices((event, value) => {
      services = value.services;
      enabled = new Set(value.enabled);
      if (document.readyState !== 'loading') renderServices();
      refilter();
    });
    document.addEventListener('DOMContentLoaded', renderServices);
  </script>
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
</head>
<body>
<div id="services"></div>
<div id="terminal"></div>
<script>
  // Match the OS color scheme
  const darkScheme = window.matchMedia('(prefers-color-scheme: dark)');
  const getTheme = () => darkScheme.matches ? {
    background: '#242424',
    foreground: '#c9c9c9',
  } : {
    background: 'white',
    foreground: '#242424',
    cursor: '#242424',
    selectionBackground: '#b5d5ff',
  };
  const t = new Terminal({
    disableStdin: true,
    convertEol: true,
    scrollback: 10000,
    fontFamily: 'monospace',
    theme: getTheme(),
  });
  darkScheme.addEventListener('change', () => t.options.theme = getTheme());
  const fitAddon = new FitAddon.FitAddon();
  t.loadAddon(fitAddon);
  const terminal = document.getElementById('terminal');
  t.open(terminal);
  fitAddon.fit();
  const sendSize = () => window.electronAPI.resizePty({ cols: t.cols, rows: t.rows });
  sendSize();
  let resizeFrame = null;
  const resizeObserver = new ResizeObserver(() => {
    if (resizeFrame !== null) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      resizeFrame = null;
      fitAddon.fit();
      sendSize();
    });
  });
  resizeObserver.observe(terminal);
  term = t;
  while (pending.length) term.write(filter(pending.shift()));
  window.electronAPI.fetchLogs();
</script>
</body>
</html>
