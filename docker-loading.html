<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preparing Jasper</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      align-items: center;
      background: #171717;
      color: #f5f5f5;
      display: flex;
      height: 100vh;
      justify-content: center;
      margin: 0;
    }
    main {
      box-sizing: border-box;
      padding: 24px 28px;
      text-align: center;
      width: 100%;
    }
    #status {
      font-size: 14px;
      line-height: 1.4;
      margin: 0 0 18px;
      min-height: 40px;
    }
    progress {
      accent-color: #2496ed;
      height: 8px;
      width: 100%;
    }
    #percentage {
      color: #a3a3a3;
      display: block;
      font-size: 12px;
      margin-top: 8px;
      min-height: 15px;
    }
  </style>
</head>
<body>
<main>
  <p id="status">Preparing Docker...</p>
  <progress id="progress" max="100"></progress>
  <span id="percentage"></span>
</main>
<script>
  const status = document.getElementById('status');
  const progress = document.getElementById('progress');
  const percentage = document.getElementById('percentage');

  window.electronAPI.onDockerSetupProgress((_event, update) => {
    status.textContent = update.status;
    if (typeof update.percentage === 'number') {
      progress.value = update.percentage;
      percentage.textContent = `${update.percentage}%`;
    } else {
      progress.removeAttribute('value');
      percentage.textContent = '';
    }
  });
</script>
</body>
</html>
